<!DOCTYPE html>
<html lang="en">
<head>

    @keyframes pop{0%{transform:scale(.75)}65%{transform:scale(1.1)}100%{transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,74,58,.5)}70%{box-shadow:0 0 0 18px rgba(192,74,58,0)}}
    .float{animation:float 3.5s ease-in-out infinite}
    .fadeUp{animation:fadeUp .38s ease forwards}
    .pop{animation:pop .32s ease forwards}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:#E5DDD4;border-radius:4px}

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const C = {
  bg:"#FAF6F0", bgCard:"#FFFFFF", bgMuted:"#F3EDE4",
  text:"#2D3748", textSub:"#6B7280", textMut:"#9CA3AF",
  border:"#E5DDD4",
  teal:"#2D8F7B", tealL:"#E0F5F0", tealD:"#1A6B5A",
  purple:"#6B5EA8", purpleL:"#EEE9FF",
  amber:"#C47A1E", amberL:"#FDF3DC", amberD:"#9A5E10",
  green:"#2A8050", greenL:"#E3F5EB",
  coral:"#C04A3A", coralL:"#FDEEE9",
  dori:"#2E7AB0", doriL:"#E4F1FB",
  orange:"#D4652A", orangeL:"#FDF0E8",
  gold:"#D4960A", goldL:"#FEF8DC",
  pink:"#9B3A8C", pinkL:"#F9EDFB",
};

const LS = {
  get:(k)=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  del:(k)=>{try{localStorage.removeItem(k)}catch{}},
};

function saveActivity(username, entry){
  const users = LS.get("nb_users")||{};
  const u = users[username];
  if(!u) return;
  u.activities = u.activities||[];
  u.activities.push({...entry, at: new Date().toISOString()});
  users[username] = u;
  LS.set("nb_users", users);
}

/* ── Gemini API (non-streaming, simpler & more reliable) ── */
async function callAI(system, userMsg) {
  const key = window.GEMINI_API_KEY;
  if (!key) throw new Error("No API key");
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ role: "user", parts: [{ text: userMsg }] }],
      systemInstruction: { parts: [{ text: system }] },
      generationConfig: { maxOutputTokens: 900, temperature: 0.8 }
    })
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error("Gemini API " + r.status + ": " + err);
  }
  const data = await r.json();
  return data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
}

/* streaming wrapper — calls callAI then drip-feeds the result */
async function streamAI(system, userMsg, onChunk) {
  const text = await callAI(system, userMsg);
  // simulate streaming so existing onChunk UI still works
  let built = "";
  for (let i = 0; i < text.length; i += 6) {
    built += text.slice(i, i + 6);
    onChunk(built);
    await new Promise(r => setTimeout(r, 10));
  }
  return text;
}

function pj(txt){try{return JSON.parse(txt.replace(/```json|```/g,"").trim())}catch{return null}}

function wordAccuracy(orig, spoken){
  const clean=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,"").trim().split(/\s+/).filter(Boolean);
  const a=clean(orig),b=clean(spoken);
  if(!a.length||!b.length)return 0;
  const dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  return Math.round((2*dp[a.length][b.length]/(a.length+b.length))*100);
}

const Spin=({c=C.teal,s=32})=><div style={{width:s,height:s,border:`3px solid ${C.border}`,borderTopColor:c,borderRadius:"50%",animation:"spin .7s linear infinite",margin:"0 auto"}}/>;
const Badge=({text,color})=><span style={{background:color+"22",color,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700,letterSpacing:.3}}>{text}</span>;

function Dori({size=80,mood="happy",speaking=false}){
  const m={
    happy:{mouth:"M 12 22 Q 20 28 28 22",body:"#2E7AB0",fin:"#D4960A"},
    thinking:{mouth:"M 14 22 Q 20 20 26 22",body:"#3A6B9E",fin:"#C47A1E"},
    excited:{mouth:"M 10 20 Q 20 30 30 20",body:"#2563A8",fin:"#D4960A"},
    reading:{mouth:"M 13 23 Q 20 26 27 23",body:"#2D5FA0",fin:"#D4960A"},
    celebrate:{mouth:"M 10 20 Q 20 32 30 20",body:"#1E8AB0",fin:"#D4650A"},
    record:{mouth:"M 11 21 Q 20 30 29 21",body:"#C0382A",fin:"#D4960A"},
    sad:{mouth:"M 12 26 Q 20 22 28 26",body:"#4A90A8",fin:"#C47A1E"},
  }[mood]||{mouth:"M 12 22 Q 20 28 28 22",body:"#2E7AB0",fin:"#D4960A"};
  return(
    <div className="float" style={{display:"inline-flex",flexDirection:"column",alignItems:"center",gap:4,position:"relative"}}>
      <svg width={size} height={size*0.75} viewBox="0 0 80 60" fill="none">
        <path d="M 62 30 L 78 18 L 75 30 L 78 42 Z" fill={m.fin} opacity=".9"/>
        <ellipse cx="35" cy="30" rx="28" ry="18" fill={m.body}/>
        <ellipse cx="28" cy="30" rx="4" ry="18" fill="white" opacity=".28"/>
        <ellipse cx="40" cy="30" rx="3.5" ry="17" fill="white" opacity=".16"/>
        <path d="M 20 12 Q 30 2 42 12" stroke="#1A3F7A" strokeWidth="3" fill="none" strokeLinecap="round"/>
        <circle cx="16" cy="24" r="7" fill="white"/>
        <circle cx="16" cy="24" r="4.5" fill="#1A3F7A"/>
        <circle cx="16" cy="24" r="2" fill="#000"/>
        <circle cx="17.5" cy="22.5" r="1.2" fill="white"/>
        <path d={m.mouth} stroke="#1A3F7A" strokeWidth="2" fill="none" strokeLinecap="round"/>
        <path d="M 30 46 Q 24 56 18 50 Q 24 48 30 46Z" fill={m.fin} opacity=".8"/>
        <path d="M 44 46 Q 50 56 56 50 Q 50 48 44 46Z" fill={m.fin} opacity=".8"/>
      </svg>
      <div style={{fontSize:11,fontWeight:700,color:m.body}}>Dori</div>
      {speaking&&<div className="pop" style={{position:"absolute",top:-10,right:-10,background:C.bgCard,borderRadius:10,padding:"3px 8px",fontSize:11,fontWeight:700,color:m.body,boxShadow:"0 2px 8px #0002",border:`1.5px solid ${m.body}`}}>💬</div>}
    </div>
  );
}

function Bubble({text,color=C.orange}){
  return(
    <div className="fadeUp" style={{background:C.bgCard,border:`2px solid ${color}`,borderRadius:14,padding:"10px 15px",maxWidth:260,fontSize:13,fontWeight:600,color:C.text,lineHeight:1.55,position:"relative",boxShadow:`0 3px 12px ${color}20`}}>
      {text}
      <div style={{position:"absolute",bottom:-10,left:18,width:0,height:0,borderLeft:"8px solid transparent",borderRight:"8px solid transparent",borderTop:`10px solid ${color}`}}/>
      <div style={{position:"absolute",bottom:-6.5,left:20,width:0,height:0,borderLeft:"6px solid transparent",borderRight:"6px solid transparent",borderTop:`8px solid ${C.bgCard}`}}/>
    </div>
  );
}

const BackBtn=({onClick,label="← Back"})=><button onClick={onClick} style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:9,padding:"7px 13px",fontSize:13,fontWeight:600,marginBottom:18,color:C.text}}>{label}</button>;

/* ══════════ API KEY SETUP ══════════ */
function ApiKeySetup({onDone}){
  const [key,setKey]=useState("");
  const [err,setErr]=useState("");
  const [testing,setTesting]=useState(false);

  const save=async()=>{
    const k = key.trim();
    if(!k){setErr("Please paste your Gemini API key.");return;}
    setTesting(true); setErr("");
    try{
      const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${k}`;
      const r=await fetch(url,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{role:"user",parts:[{text:"Hi"}]}],generationConfig:{maxOutputTokens:5}})
      });
      if(!r.ok){setErr("Key didn't work (status "+r.status+"). Double-check and try again.");setTesting(false);return;}
      window.GEMINI_API_KEY = k;
      LS.set("nb_gemini_key", k);
      onDone();
    }catch(e){setErr("Connection failed — check your internet connection.");}
    setTesting(false);
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"1.5rem",background:C.bg}}>
      <div style={{background:C.bgCard,borderRadius:22,padding:"2rem",width:"100%",maxWidth:420,boxShadow:"0 6px 32px #0001",border:`1px solid ${C.border}`}}>
        <div style={{textAlign:"center",marginBottom:22}}>
          <Dori size={80} mood="happy" speaking/>
          <div className="fred" style={{fontSize:26,color:C.orange,marginTop:8}}>NeuroBridge</div>
          <div style={{fontSize:14,color:C.textSub,marginTop:4,fontWeight:500}}>Every brain learns differently 🐠</div>
        </div>
        <div style={{background:C.doriL,borderRadius:12,padding:"13px 15px",marginBottom:18,border:`1px solid ${C.dori}25`}}>
          <div style={{fontSize:13,fontWeight:700,color:C.dori,marginBottom:6}}>🔑 One-time setup needed</div>
          <div style={{fontSize:12,lineHeight:1.75,color:C.text}}>
            NeuroBridge uses Google Gemini AI to personalise learning.<br/><br/>
            Get a <b>free</b> key at:<br/>
            <a href="https://aistudio.google.com/app/apikey" target="_blank" style={{color:C.dori,fontWeight:700}}>aistudio.google.com/app/apikey</a><br/><br/>
            Click <b>"Create API Key"</b>, copy it, paste below.
          </div>
        </div>
        <label style={{fontSize:13,fontWeight:600,color:C.textSub,display:"block",marginBottom:5}}>Gemini API Key</label>
        <input
          value={key} onChange={e=>setKey(e.target.value)}
          placeholder="AIza..."
          type="password"
          style={{width:"100%",padding:"12px 13px",borderRadius:9,border:`1.5px solid ${C.border}`,fontSize:14,outline:"none",background:C.bgMuted,marginBottom:10,color:C.text}}
        />
        {err&&<div style={{background:C.coralL,color:C.coral,borderRadius:8,padding:"9px 12px",fontSize:13,fontWeight:600,marginBottom:10}}>{err}</div>}
        <button onClick={save} disabled={testing} style={{width:"100%",background:C.orange,color:"white",borderRadius:11,padding:"13px",fontSize:15,fontWeight:700,opacity:testing?.7:1,boxShadow:`0 3px 12px ${C.orange}40`}}>
          {testing?"Testing key...":"🚀 Save & Continue"}
        </button>
        <div style={{fontSize:11,color:C.textMut,textAlign:"center",marginTop:12,lineHeight:1.7}}>
          Your key is stored only in your browser. Never shared anywhere else.
        </div>
      </div>
    </div>
  );
}

/* ══════════ LANDING ══════════ */
const DMSGS=["Just keep swimming — and learning! 🐠","I forget things too — that's totally okay! 💙","Every brain is brilliant in its own way! 🌊","P. Sherman, 42 Wallaby Way... let's learn! 🐡","You've got this — I'll be right here! ✨","Just keep swimming... just keep swimming! 🐟"];
function Landing({onAuth}){
  const [bi,setBi]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setBi(i=>(i+1)%DMSGS.length),3000);return()=>clearInterval(t)},[]);
  const pill=t=><div style={{background:C.bgCard,borderRadius:10,padding:"7px 14px",fontSize:13,fontWeight:600,color:C.text,border:`1px solid ${C.border}`}}>{t}</div>;
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"2rem 1.2rem",gap:24,background:C.bg}}>
      <div style={{textAlign:"center"}}>
        <div className="fred" style={{fontSize:44,color:C.orange}}>NeuroBridge</div>
        <div style={{fontSize:15,color:C.textSub,marginTop:6,fontWeight:500}}>Every brain learns differently — and that's a superpower.</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16}}>
        <Bubble text={DMSGS[bi]} color={C.dori}/>
        <Dori size={110} mood="excited" speaking/>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center"}}>
        {["📐 CRA Maths","📚 Orton-Gillingham Reading","🎙️ Voice Read-Aloud","🎯 ADHD Focus Games"].map(f=>pill(f))}
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center"}}>
        <button onClick={()=>onAuth("signup")} style={{background:C.orange,color:"white",borderRadius:12,padding:"13px 32px",fontSize:15,fontWeight:700,boxShadow:`0 4px 16px ${C.orange}44`}}>🚀 Start my journey!</button>
        <button onClick={()=>onAuth("login")} style={{background:C.bgCard,color:C.orange,borderRadius:12,padding:"13px 32px",fontSize:15,fontWeight:700,border:`2px solid ${C.orange}`}}>I already have an account</button>
      </div>
      <div style={{fontSize:12,color:C.textMut,textAlign:"center",maxWidth:340,lineHeight:1.7}}>
        NeuroBridge supports children alongside their teachers & parents. No diagnosis — just personalised, evidence-based learning. 💙
      </div>
    </div>
  );
}

/* ══════════ AUTH ══════════ */
function Auth({mode,onSuccess,onSwitch}){
  const [f,setF]=useState({name:"",age:"",grade:"",difficulty:"",username:"",password:""});
  const [err,setErr]=useState(""); const [dori,setDori]=useState("happy");
  const grades=["Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6","Grade 7","Grade 8"];
  const diffs=["Reading","Writing","Maths","Focus & Attention","Memory","Multiple areas"];
  const h=(k,v)=>setF(p=>({...p,[k]:v}));
  const submit=()=>{
    setErr("");
    if(mode==="signup"){
      if(!f.name||!f.age||!f.grade||!f.difficulty||!f.username||!f.password){setErr("Please fill in all fields!");return;}
      const users=LS.get("nb_users")||{};
      if(users[f.username]){setErr("That username is taken — try another!");return;}
      const user={...f,joinedAt:new Date().toISOString(),activities:[],streak:0,lastActive:null};
      users[f.username]=user; LS.set("nb_users",users); LS.set("nb_cur",f.username);
      setDori("celebrate"); setTimeout(()=>onSuccess(user),350);
    }else{
      if(!f.username||!f.password){setErr("Please enter username and password!");return;}
      const users=LS.get("nb_users")||{}; const user=users[f.username];
      if(!user||user.password!==f.password){setErr("Those details don't match — try again!");return;}
      LS.set("nb_cur",f.username); setDori("celebrate"); setTimeout(()=>onSuccess(user),350);
    }
  };
  const inp={width:"100%",padding:"11px 13px",borderRadius:9,border:`1.5px solid ${C.border}`,fontSize:15,fontWeight:500,outline:"none",background:C.bgCard,color:C.text};
  const lbl={fontSize:13,fontWeight:600,color:C.textSub,marginBottom:4,display:"block"};
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem",background:C.bg}}>
      <div style={{background:C.bgCard,borderRadius:22,padding:"2rem",width:"100%",maxWidth:420,boxShadow:"0 6px 32px #0001",border:`1px solid ${C.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:22}}>
          <Dori size={58} mood={dori}/>
          <div>
            <div className="fred" style={{fontSize:21,color:C.orange}}>{mode==="signup"?"Let's get started!":"Welcome back!"}</div>
            <div style={{fontSize:13,color:C.textSub,fontWeight:500}}>{mode==="signup"?"Dori will guide you!":"Dori missed you! 🐠"}</div>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          {mode==="signup"&&<>
            <div><label style={lbl}>Your name</label><input style={inp} placeholder="e.g. Arjun" value={f.name} onChange={e=>h("name",e.target.value)}/></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><label style={lbl}>Age</label><input style={inp} type="number" min="4" max="18" placeholder="e.g. 9" value={f.age} onChange={e=>h("age",e.target.value)}/></div>
              <div><label style={lbl}>Grade</label><select style={inp} value={f.grade} onChange={e=>h("grade",e.target.value)}><option value="">Select</option>{grades.map(g=><option key={g}>{g}</option>)}</select></div>
            </div>
            <div>
              <label style={lbl}>Where do you sometimes find things tricky?</label>
              <select style={inp} value={f.difficulty} onChange={e=>h("difficulty",e.target.value)}><option value="">Choose one</option>{diffs.map(d=><option key={d}>{d}</option>)}</select>
            </div>
          </>}
          <div><label style={lbl}>Username</label><input style={inp} placeholder="Create a username" value={f.username} onChange={e=>h("username",e.target.value)}/></div>
          <div><label style={lbl}>Password</label><input style={inp} type="password" placeholder="Keep it secret!" value={f.password} onChange={e=>h("password",e.target.value)}/></div>
          {err&&<div style={{background:C.coralL,color:C.coral,borderRadius:8,padding:"9px 12px",fontSize:13,fontWeight:600}}>{err}</div>}
          <button onClick={submit} style={{background:C.orange,color:"white",borderRadius:11,padding:"13px",fontSize:15,fontWeight:700,boxShadow:`0 3px 12px ${C.orange}40`}}>{mode==="signup"?"🚀 Let's go!":"🌟 Sign in!"}</button>
          <div style={{textAlign:"center",fontSize:13,color:C.textSub}}>
            {mode==="signup"?"Already have an account? ":"New here? "}
            <span onClick={onSwitch} style={{color:C.orange,cursor:"pointer",fontWeight:700,textDecoration:"underline"}}>{mode==="signup"?"Sign in":"Create account"}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════ HOME ══════════ */
const QUOTES=["Just keep swimming — every effort counts! 🐠","Your brain is like the ocean — deep and full of wonders! 🌊","Mistakes are hidden treasures waiting to be found! 💎","You don't have to be perfect to be wonderful! ⭐","Every day you learn is a step into a new adventure! 🚀","The more you practise, the stronger your brain gets! 🧠","Dori believes in you — and so does your teacher! 💙"];

function Home({user,nav,onLogout}){
  const live=LS.get("nb_users")?.[user.username]||user;
  const acts=live.activities||[];
  const pts=acts.reduce((s,a)=>s+(a.points||0),0);
  const todaySessions=acts.filter(a=>new Date(a.at).toDateString()===new Date().toDateString()).length;
  const cards=[
    {key:"math",   icon:"📐",label:"Maths",             sub:"CRA · Number lines · Flashcards · Quiz",      bg:C.tealL,   accent:C.teal},
    {key:"reading",icon:"📚",label:"Reading & Writing",  sub:"Voice read-aloud · Phonics · Word building",  bg:C.purpleL, accent:C.purple},
    {key:"focus",  icon:"🎯",label:"Focus Games",        sub:"Working memory · Impulse control · Attention", bg:C.amberL,  accent:C.amber},
  ];
  return(
    <div style={{minHeight:"100vh",padding:"1.4rem 1rem 6rem",background:C.bg}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div className="fred" style={{fontSize:24,color:C.orange}}>NeuroBridge</div>
        <div style={{display:"flex",gap:7}}>
          <button onClick={()=>nav("dashboard")} style={{background:C.bgMuted,borderRadius:9,padding:"7px 11px",fontSize:13,fontWeight:600,color:C.text,border:`1px solid ${C.border}`}}>⚙️ Dashboard</button>
          <button onClick={onLogout} style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:9,padding:"7px 11px",fontSize:13,fontWeight:600,color:C.textSub}}>Sign out</button>
        </div>
      </div>
      <div style={{background:`linear-gradient(135deg,${C.orange},${C.amber})`,borderRadius:18,padding:"15px 18px",marginBottom:16,color:"white"}}>
        <div style={{fontSize:11,fontWeight:600,opacity:.8,marginBottom:3,letterSpacing:.5}}>✨ DAILY WISDOM FROM DORI</div>
        <div style={{fontSize:14,fontWeight:600,lineHeight:1.55}}>{QUOTES[new Date().getDay()%QUOTES.length]}</div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:13,marginBottom:20}}>
        <Dori size={62} mood="happy"/>
        <div style={{flex:1}}>
          <div className="fred" style={{fontSize:22,color:C.text}}>Hey, {live.name}! 👋</div>
          <div style={{fontSize:12,color:C.textSub,marginTop:1}}>{live.grade} · Age {live.age} · {live.difficulty}</div>
          <div style={{display:"flex",gap:10,marginTop:5}}>
            <span style={{background:C.goldL,color:C.amberD,borderRadius:8,padding:"3px 10px",fontSize:12,fontWeight:700}}>⭐ {pts} pts</span>
            <span style={{background:C.tealL,color:C.tealD,borderRadius:8,padding:"3px 10px",fontSize:12,fontWeight:700}}>📅 {todaySessions} today</span>
          </div>
        </div>
      </div>
      <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:11}}>What shall we explore today?</div>

function CRAActivity(){
  const [stage,setStage]=useState("concrete");

  const [checked,setChecked]=useState(false);
  const [fb,setFb]=useState("");
  const newProb=useCallback(()=>{const n1=Math.floor(Math.random()*6)+1,n2=Math.floor(Math.random()*6)+1;setProb({n1,n2,ans:n1+n2});setStage("concrete");setAnswer("");setChecked(false);setFb("");},[]);

  if(!prob)return null;
  const si={concrete:{label:"Stage 1: CONCRETE — Count the blocks!",tip:"Count blue, then yellow, then ALL together!",color:C.teal},representational:{label:"Stage 2: PICTURES — Count the dots!",tip:"Just shapes now — count them all!",color:C.purple},abstract:{label:"Stage 3: NUMBERS — Write the answer!",tip:"You already counted it — just write the number!",color:C.orange}}[stage];
  return(<div>
    <div style={{background:si.color,color:"white",borderRadius:12,padding:"11px 15px",marginBottom:14,fontWeight:700,fontSize:13}}>{si.label}</div>
    <div style={{background:C.bgCard,borderRadius:16,padding:"22px",marginBottom:14,border:`1.5px solid ${si.color}30`,textAlign:"center"}}>
      <div className="fred" style={{fontSize:24,color:C.text,marginBottom:16}}>{prob.n1} + {prob.n2} = ?</div>
      {stage==="concrete"&&<div>
        <div style={{display:"flex",gap:5,justifyContent:"center",flexWrap:"wrap",marginBottom:6}}>{Array(prob.n1).fill("🔵").map((b,i)=><span key={i} style={{fontSize:28}}>{b}</span>)}</div>
        <div style={{fontSize:16,fontWeight:600,color:C.textSub,margin:"6px 0"}}>+</div>
        <div style={{display:"flex",gap:5,justifyContent:"center",flexWrap:"wrap"}}>{Array(prob.n2).fill("🟡").map((b,i)=><span key={i} style={{fontSize:28}}>{b}</span>)}</div>
      </div>}

        <div style={{display:"flex",gap:5,flexWrap:"wrap",maxWidth:120,justifyContent:"center"}}>{Array(prob.n1).fill(0).map((_,i)=><div key={i} style={{width:22,height:22,borderRadius:"50%",background:C.teal}}/>)}</div>
        <div className="fred" style={{fontSize:26}}>+</div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",maxWidth:120,justifyContent:"center"}}>{Array(prob.n2).fill(0).map((_,i)=><div key={i} style={{width:22,height:22,borderRadius:"50%",background:C.amber}}/>)}</div>
      </div>}
      {stage==="abstract"&&<input value={answer} onChange={e=>setAnswer(e.target.value)} type="number" placeholder="?" style={{width:110,padding:"12px",borderRadius:12,border:`2px solid ${C.amber}`,fontSize:28,fontWeight:700,textAlign:"center",outline:"none",background:C.goldL}}/>}
      <div style={{fontSize:12,color:si.color,fontWeight:600,marginTop:12,fontStyle:"italic"}}>💡 {si.tip}</div>

    {stage==="abstract"&&!checked&&<button onClick={()=>{setChecked(true);const ok=parseInt(answer)===prob.ans;setFb(ok?"🎉 Correct! You're amazing!":"💡 Nearly! The answer is "+prob.ans+" — go back and count the blocks!");}} style={{width:"100%",background:C.amber,color:"white",borderRadius:11,padding:"12px",fontSize:14,fontWeight:700}}>Check my answer!</button>}

function NumberLineActivity(){
  const [pos,setPos]=useState(0);const [prob,setProb]=useState(null);const [jumps,setJumps]=useState(0);const [done,setDone]=useState(false);
  const newProb=useCallback(()=>{const start=Math.floor(Math.random()*5),jump=Math.floor(Math.random()*4)+1,times=Math.floor(Math.random()*3)+2;setProb({start,jump,times,ans:start+jump*times});setPos(start);setJumps(0);setDone(false);},[]);
  useEffect(()=>{newProb();},[]);

  return(<div>
    <div style={{background:C.purpleL,borderRadius:13,padding:"15px",marginBottom:14}}>
      <div className="fred" style={{fontSize:17,color:C.purple,marginBottom:3}}>🦘 Jump Challenge!</div>
      <div style={{fontSize:15,fontWeight:600}}>Start at <b>{prob.start}</b>. Jump <b>+{prob.jump}</b> exactly <b>{prob.times}</b> times. Where do you land?</div>

          </div>

    </div>}
  </div>);

function VoiceRecorder({onResult,color=C.purple}){
  const [state,setState]=useState("idle");const [transcript,setTranscript]=useState("");const [err,setErr]=useState("");const recRef=useRef(null);
  const start=()=>{setErr("");setTranscript("");const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setErr("Voice recording needs Chrome or Edge browser.");return;}const rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang="en-US";let finalT="";rec.onstart=()=>setState("recording");rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finalT+=e.results[i][0].transcript+" ";else interim+=e.results[i][0].transcript;}setTranscript((finalT+interim).trim());};rec.onend=()=>{setTranscript(t=>{const v=finalT.trim()||t;setState(v?"done":"idle");return v||t;});};rec.onerror=()=>{setErr("Couldn't hear clearly — check your microphone!");setState("idle");};recRef.current=rec;rec.start();};
  const stop=()=>{recRef.current?.stop();};const reset=()=>{setState("idle");setTranscript("");setErr("");};

function PhonicsActivity({user}){
  const bank=[{sound:"c · a · t",word:"cat",options:["cat","cut","cot","cap"],level:"CVC"},{sound:"d · o · g",word:"dog",options:["dig","dog","dot","dug"],level:"CVC"},{sound:"s · u · n",word:"sun",options:["sin","son","sun","sit"],level:"CVC"},{sound:"h · a · t",word:"hat",options:["hot","hit","hat","hut"],level:"CVC"},{sound:"r · u · n",word:"run",options:["ran","run","rug","rub"],level:"CVC"},{sound:"b · i · g",word:"big",options:["bug","bag","big","beg"],level:"CVC"},{sound:"sh · i · p",word:"ship",options:["chip","ship","slip","shop"],level:"Digraph"},{sound:"f · i · sh",word:"fish",options:["dish","fish","wish","fist"],level:"Digraph"},{sound:"th · i · n",word:"thin",options:["chin","thin","twin","shin"],level:"Digraph"},{sound:"bl · a · ck",word:"black",options:["black","block","blank","blade"],level:"Blend"},{sound:"st · a · r",word:"star",options:["scar","star","stir","stab"],level:"Blend"},{sound:"dr · u · m",word:"drum",options:["dram","drum","drop","drip"],level:"Blend"}];
  const gn=parseInt((user?.grade||"Grade 2").replace(/\D/g,""))||2;
  const lvls=gn<=2?["CVC"]:gn<=4?["CVC","Digraph"]:["CVC","Digraph","Blend"];
  const pool=bank.filter(p=>lvls.includes(p.level));
  const [idx,setIdx]=useState(()=>Math.floor(Math.random()*pool.length));const [sel,setSel]=useState(null);const [score,setScore]=useState(0);const [round,setRound]=useState(1);const [speechOk,setSpeechOk]=useState(true);
  const cur=pool[idx%pool.length];
  const speak=useCallback(()=>{try{if(!window.speechSynthesis){setSpeechOk(false);return;}window.speechSynthesis.cancel();const letters=cur.sound.split("·").map(s=>s.trim()).filter(Boolean);const say=i=>{if(i>=letters.length)return;const u=new SpeechSynthesisUtterance(letters[i]);u.rate=0.65;u.pitch=1.1;u.onend=()=>setTimeout(()=>say(i+1),320);u.onerror=()=>setSpeechOk(false);window.speechSynthesis.speak(u);};say(0);}catch{setSpeechOk(false);}},[cur]);
  const pick=opt=>{if(sel!==null)return;setSel(opt);if(opt===cur.word)setScore(s=>s+1);};
  const next=()=>{setIdx(i=>{let n;do{n=Math.floor(Math.random()*pool.length);}while(n===(i%pool.length)&&pool.length>1);return n;});setSel(null);setRound(r=>r+1);};
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><Badge text={cur.level} color={C.teal}/><div style={{fontSize:13,fontWeight:700,color:C.textSub}}>Round {round} · Score: <span style={{color:C.amber,fontWeight:800}}>{score}</span></div></div>
    <div style={{background:C.tealL,borderRadius:16,padding:"22px 20px",marginBottom:16,textAlign:"center"}}>
      <div style={{fontSize:12,fontWeight:700,color:C.tealD,letterSpacing:.8,marginBottom:12}}>BLEND THESE SOUNDS:</div>
      <div style={{display:"flex",gap:8,justifyContent:"center",alignItems:"center",marginBottom:16,flexWrap:"wrap"}}>
        {cur.sound.split("·").map((s,i,arr)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{background:C.bgCard,border:`2px solid ${C.teal}`,borderRadius:10,padding:"10px 16px",minWidth:46,textAlign:"center"}}><div className="fred" style={{fontSize:24,color:C.teal,lineHeight:1}}>{s.trim()}</div></div>
            {i<arr.length-1&&<div style={{fontSize:20,color:C.tealD,fontWeight:700}}>+</div>}
          </div>
        ))}
      </div>
      <button onClick={speak} style={{background:C.teal,color:"white",borderRadius:10,padding:"10px 22px",fontSize:14,fontWeight:700}}>🔊 Hear the sounds</button>
      {!speechOk&&<div style={{fontSize:11,color:C.textMut,marginTop:7}}>🔇 Sound unavailable — read the letters above!</div>}
      <div style={{fontSize:12,color:C.tealD,fontWeight:600,marginTop:12}}>Put these sounds together — which word do they make?</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
      {cur.options.map((opt,i)=>{let bg=C.bgCard,col=C.text,brd=`1.5px solid ${C.border}`;if(sel!==null){if(opt===cur.word){bg=C.greenL;col=C.green;brd=`2.5px solid ${C.green}`;}else if(opt===sel){bg=C.coralL;col=C.coral;brd=`2px solid ${C.coral}`;}}return(<button key={i} onClick={()=>pick(opt)} disabled={sel!==null} style={{background:bg,color:col,borderRadius:13,padding:"18px 12px",fontSize:20,fontWeight:700,border:brd,textAlign:"center",transition:"all .15s"}}>{opt}</button>);})}
    </div>
    {sel!==null&&<div>
      <div style={{background:sel===cur.word?C.greenL:C.amberL,borderRadius:12,padding:"13px 15px",marginBottom:12}}><div style={{fontSize:14,fontWeight:700,color:sel===cur.word?C.green:C.amberD,marginBottom:3}}>{sel===cur.word?"🎉 Yes! The sounds make \""+cur.word+"\"!":"💡 The sounds blend into \""+cur.word+"\" — say each part slowly!"}</div><div style={{fontSize:12,color:C.textSub}}>Sound it out: {cur.sound.replace(/·/g,"—")}</div></div>
      <button onClick={next} style={{width:"100%",background:C.teal,color:"white",borderRadius:11,padding:"12px",fontSize:14,fontWeight:700}}>Next word! →</button>
    </div>}
  </div>);
}

function WordBuilderActivity(){
  const words=[{word:"cat",hint:"A furry pet 🐱"},{word:"fish",hint:"Dori's friends 🐠"},{word:"bird",hint:"It can fly! 🐦"},{word:"frog",hint:"It says ribbit! 🐸"},{word:"ship",hint:"Sails on water ⛵"},{word:"drum",hint:"You bang it! 🥁"},{word:"star",hint:"Shines at night ⭐"},{word:"clap",hint:"You do this at shows 👏"},{word:"flag",hint:"Flies in the wind 🏳️"},{word:"grip",hint:"Holding something tightly ✊"}];
  const [ci,setCi]=useState(0);const [letters,setLetters]=useState([]);const [placed,setPlaced]=useState([]);const [done,setDone]=useState(false);
  const setup=useCallback(idx=>{const w=words[idx].word;setLetters([...w].sort(()=>Math.random()-.5).map((l,i)=>({l,id:i,used:false})));setPlaced([]);setDone(false);},[]);
  useEffect(()=>{setup(0);},[]);
  const tap=letter=>{if(letter.used||done)return;const np=[...placed,letter];setPlaced(np);setLetters(ls=>ls.map(l=>l.id===letter.id?{...l,used:true}:l));if(np.map(l=>l.l).join("")===words[ci].word)setDone(true);else if(np.length===words[ci].word.length)setTimeout(()=>setup(ci),700);};
  const remove=()=>{if(!placed.length||done)return;const last=placed[placed.length-1];setPlaced(p=>p.slice(0,-1));setLetters(ls=>ls.map(l=>l.id===last.id?{...l,used:false}:l));};
  return(<div>
    <div style={{background:C.orangeL,borderRadius:12,padding:"13px 15px",marginBottom:14}}><div style={{fontSize:13,fontWeight:700,color:C.orange}}>Hint: {words[ci].hint}</div><div style={{fontSize:12,color:C.textSub,marginTop:2}}>Word {ci+1}/{words.length} — Tap letters to build the word!</div></div>
    <div style={{display:"flex",gap:7,justifyContent:"center",marginBottom:18,minHeight:58,flexWrap:"wrap"}}>{Array.from({length:words[ci].word.length}).map((_,i)=><div key={i} style={{width:46,height:50,borderRadius:9,border:`2px solid ${placed[i]?C.orange:C.border}`,background:placed[i]?(done?C.greenL:C.bgCard):C.bgMuted,display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s"}}><span className="fred" style={{fontSize:22,color:placed[i]?(done?C.green:C.text):"transparent"}}>{placed[i]?.l||"_"}</span></div>)}</div>
    <div style={{display:"flex",gap:7,justifyContent:"center",flexWrap:"wrap",marginBottom:14}}>{letters.map(l=><button key={l.id} onClick={()=>tap(l)} disabled={l.used||done} style={{width:50,height:50,borderRadius:9,background:l.used?C.bgMuted:C.orange,color:l.used?C.border:"white",fontSize:20,fontWeight:700,opacity:l.used?.35:1,fontFamily:"'Fredoka One',cursive"}}>{l.l}</button>)}</div>
    <div style={{display:"flex",gap:8}}><button onClick={remove} style={{flex:1,background:C.bgCard,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"10px",fontSize:13,fontWeight:700}}>⌫ Remove</button><button onClick={()=>setup(ci)} style={{flex:1,background:C.bgMuted,borderRadius:9,padding:"10px",fontSize:13,fontWeight:700}}>🔄 Reset</button></div>
    {done&&<div style={{background:C.greenL,borderRadius:12,padding:"16px",marginTop:12,textAlign:"center"}}>
      <div className="pop" style={{fontSize:22,marginBottom:4}}>🎉</div>
      <div className="fred" style={{fontSize:20,color:C.green}}>"{words[ci].word}" — Perfect!</div>
      {ci<words.length-1?<button onClick={()=>{const n=ci+1;setCi(n);setup(n);}} style={{background:C.orange,color:"white",borderRadius:9,padding:"9px 22px",fontSize:13,fontWeight:700,marginTop:10}}>Next word! →</button>:<div style={{fontSize:13,fontWeight:700,color:C.green,marginTop:8}}>You built ALL the words! Amazing! 🌟</div>}
    </div>}
  </div>);
}

function SyllableTapActivity(){
  const words=[{word:"butter",s:2,beats:["but","ter"]},{word:"elephant",s:3,beats:["el","e","phant"]},{word:"computer",s:3,beats:["com","pu","ter"]},{word:"cat",s:1,beats:["cat"]},{word:"beautiful",s:4,beats:["beau","ti","ful"]},{word:"umbrella",s:3,beats:["um","brel","la"]},{word:"bicycle",s:3,beats:["bi","cy","cle"]},{word:"waterfall",s:3,beats:["wa","ter","fall"]}];
  const [ci,setCi]=useState(0);const [taps,setTaps]=useState(0);const [done,setDone]=useState(false);const [flash,setFlash]=useState(false);
  const speak=()=>{try{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(words[ci].word);u.rate=0.55;u.pitch=1.1;window.speechSynthesis.speak(u);}catch{}};
  const tap=()=>{if(done)return;setFlash(true);setTimeout(()=>setFlash(false),140);const nt=taps+1;setTaps(nt);if(nt===words[ci].s)setDone(true);};
  const next=()=>{const n=(ci+1)%words.length;setCi(n);setTaps(0);setDone(false);};
  return(<div style={{textAlign:"center"}}>
    <div style={{background:C.doriL,borderRadius:14,padding:"18px",marginBottom:18}}><div style={{fontSize:12,fontWeight:700,color:C.dori,marginBottom:7}}>Listen to the word, then tap once for each syllable!</div><button onClick={speak} style={{background:C.dori,color:"white",borderRadius:9,padding:"9px 18px",fontSize:13,fontWeight:700,marginBottom:10}}>🔊 Hear the word</button><div className="fred" style={{fontSize:36,color:C.text}}>{words[ci].word}</div></div>
    <button onClick={tap} disabled={done} style={{width:130,height:130,borderRadius:"50%",background:flash?C.dori:C.doriL,border:`3px solid ${C.dori}`,fontSize:36,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",transition:"all .1s",cursor:"pointer"}}>👏</button>
    <div style={{display:"flex",gap:7,justifyContent:"center",marginBottom:14}}>{Array.from({length:words[ci].s}).map((_,i)=><div key={i} style={{width:32,height:32,borderRadius:"50%",background:i<taps?C.dori:C.bgMuted,border:`2px solid ${i<taps?C.dori:C.border}`,transition:"all .2s"}}/>)}</div>
    <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>Taps: {taps} / {words[ci].s} syllable{words[ci].s>1?"s":""}</div>
    {done&&<div style={{background:taps===words[ci].s?C.greenL:C.coralL,borderRadius:12,padding:"14px",marginBottom:12}}><div style={{fontWeight:700,fontSize:14,color:taps===words[ci].s?C.green:C.coral}}>{taps===words[ci].s?"🎉 Perfect! \""+words[ci].word+"\" has "+words[ci].s+" syllable"+(words[ci].s>1?"s!":"!"):"The beats are: "+words[ci].beats.join(" · ")}</div><button onClick={next} style={{background:C.dori,color:"white",borderRadius:9,padding:"9px 22px",fontSize:13,fontWeight:700,marginTop:10}}>Next word! →</button></div>}
  </div>);
}

function SentenceBuilderActivity({user}){
  const [q,setQ]=useState(null);const [placed,setPlaced]=useState([]);const [done,setDone]=useState(false);const [loading,setLoading]=useState(true);const [shuffled,setShuffled]=useState([]);
  const load=useCallback(async()=>{
    setLoading(true);setPlaced([]);setDone(false);
    const sys=`Sentence building for ${user.grade} student age ${user.age}. Simple 5-7 word sentence. Return ONLY raw JSON: {"sentence":"The cat sat on the mat","words":["The","cat","sat","on","the","mat"],"hint":"Where does the cat sit?"}. No markdown.`;
    try{const t=await callAI(sys,"Sentence activity");const p=pj(t);if(p?.sentence){setQ(p);setShuffled([...p.words.entries()].sort(()=>Math.random()-.5));}else throw new Error();}
    catch{const fb={sentence:"The fish swam in the ocean",words:["The","fish","swam","in","the","ocean"],hint:"Where does the fish swim?"};setQ(fb);setShuffled([...fb.words.entries()].sort(()=>Math.random()-.5));}
    setLoading(false);
  },[user]);
  useEffect(()=>{load();},[]);
  const tapWord=(word,i)=>{if(placed.find(p=>p.i===i)||done)return;const np=[...placed,{word,i}];setPlaced(np);if(np.length===q.words.length)setDone(np.map(p=>p.word).join(" ")===q.sentence);};
  if(loading)return <div style={{textAlign:"center",padding:44}}><Spin c={C.purple}/></div>;
  if(!q)return null;
  return(<div>
    <div style={{background:C.purpleL,borderRadius:12,padding:"13px 15px",marginBottom:14}}><div style={{fontSize:13,fontWeight:700,color:C.purple}}>💡 Hint: {q.hint}</div></div>
    <div style={{minHeight:52,background:C.bgCard,borderRadius:12,padding:"11px",border:`1.5px solid ${C.purple}30`,display:"flex",flexWrap:"wrap",gap:6,marginBottom:14,alignItems:"center"}}>{placed.map((p,i)=><span key={i} style={{background:C.purple,color:"white",borderRadius:7,padding:"5px 11px",fontSize:14,fontWeight:700}}>{p.word}</span>)}{!placed.length&&<span style={{fontSize:12,color:C.textMut}}>Tap words below to build your sentence!</span>}</div>
    <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:14}}>{shuffled.map(([i,w])=><button key={i} onClick={()=>tapWord(w,i)} disabled={!!placed.find(p=>p.i===i)} style={{background:placed.find(p=>p.i===i)?C.bgMuted:C.purpleL,color:placed.find(p=>p.i===i)?C.textMut:C.purple,borderRadius:9,padding:"9px 14px",fontSize:14,fontWeight:700,border:`1px solid ${placed.find(p=>p.i===i)?C.border:C.purple}30`}}>{w}</button>)}</div>
    <button onClick={()=>{setPlaced([]);setDone(false);}} style={{background:C.bgCard,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"9px",width:"100%",fontSize:13,fontWeight:700}}>🔄 Reset</button>
    {placed.length===q.words.length&&<div style={{background:done?C.greenL:C.amberL,borderRadius:12,padding:"14px",marginTop:12}}>
      <div className="fred" style={{fontSize:18,color:done?C.green:C.amberD,marginBottom:done?6:3}}>{done?"🎉 Perfect sentence!":"💡 Not quite — try rearranging!"}</div>
      {done&&<div style={{fontSize:14,fontWeight:700}}>"{q.sentence}"</div>}
      {done&&<button onClick={load} style={{background:C.purple,color:"white",borderRadius:9,padding:"9px 22px",fontSize:13,fontWeight:700,marginTop:10}}>Next sentence! →</button>}
      {!done&&<button onClick={()=>{setPlaced([]);setDone(false);}} style={{background:C.amber,color:"white",borderRadius:9,padding:"9px 22px",fontSize:13,fontWeight:700,marginTop:8}}>Try again!</button>}
    </div>}

function GlowSequence({onDone}){
  const COLS=["#D4652A","#2D8F7B","#6B5EA8","#C47A1E"];
  const [seq,setSeq]=useState([]);const [player,setPlayer]=useState([]);const [phase,setPhase]=useState("start");const [active,setActive]=useState(null);const [level,setLevel]=useState(1);const [score,setScore]=useState(0);const [flash,setFlash]=useState(null);
  const startRound=useCallback(()=>{const s=[...Array(level+1)].map(()=>Math.floor(Math.random()*4));setSeq(s);setPlayer([]);setPhase("show");let i=0;const show=()=>{if(i>=s.length){setPhase("input");return;}setActive(s[i]);setTimeout(()=>{setActive(null);setTimeout(()=>{i++;show();},280);},560);};setTimeout(show,500);},[level]);
  const tap=i=>{if(phase!=="input")return;setFlash(i);setTimeout(()=>setFlash(null),180);const next=[...player,i];if(next[next.length-1]!==seq[next.length-1]){setPhase("result");return;}if(next.length===seq.length){setScore(s=>s+level);setLevel(l=>l+1);setPlayer([]);setTimeout(startRound,700);}else setPlayer(next);};
  return(<div style={{textAlign:"center",padding:"1rem"}}>
    <div className="fred" style={{fontSize:22,color:C.purple,marginBottom:4}}>🧠 Glow Sequence</div>
    <div style={{fontSize:13,color:C.textSub,fontWeight:600,marginBottom:18}}>Watch the pattern, then repeat it! · Level {level} · Score: <span style={{color:C.amber,fontWeight:800}}>{score}</span></div>
    {phase==="start"&&<button onClick={startRound} style={{background:C.purple,color:"white",borderRadius:11,padding:"12px 28px",fontSize:15,fontWeight:700,marginBottom:18}}>Start!</button>}
    {phase==="show"&&<div style={{fontSize:14,fontWeight:700,color:C.purple,marginBottom:16}}>Watch carefully... 👀</div>}
    {phase==="input"&&<div style={{fontSize:14,fontWeight:700,color:C.teal,marginBottom:16}}>Your turn! ({player.length}/{seq.length})</div>}
    {phase==="result"&&<div style={{marginBottom:16}}><div className="fred" style={{fontSize:24,color:C.orange,marginBottom:8}}>Great try! Score: {score}</div><button onClick={()=>{setLevel(1);setScore(0);setTimeout(startRound,200);}} style={{background:C.purple,color:"white",borderRadius:9,padding:"9px 22px",fontSize:14,fontWeight:700,marginRight:8}}>Try again!</button><button onClick={()=>onDone(score)} style={{background:C.teal,color:"white",borderRadius:9,padding:"9px 22px",fontSize:14,fontWeight:700}}>Done ✓</button></div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,maxWidth:236,margin:"0 auto"}}>
      {COLS.map((col,i)=><div key={i} onClick={()=>tap(i)} style={{width:104,height:104,borderRadius:14,background:col,cursor:"pointer",border:`4px solid ${active===i||flash===i?"white":"transparent"}`,opacity:active===i?1:.6,transform:flash===i?"scale(1.08)":"scale(1)",transition:"all .13s",boxShadow:active===i?`0 0 24px ${col}`:undefined}}/>)}
    </div>
  </div>);
}

function StopGo({onDone}){
  const [phase,setPhase]=useState("ready");const [signal,setSignal]=useState("green");const [score,setScore]=useState(0);const [misses,setMisses]=useState(0);const [taps,setTaps]=useState(0);const [timeLeft,setTimeLeft]=useState(30);const [feedback,setFeedback]=useState("");const timerRef=useRef(null);const sigRef=useRef(null);
  const start=()=>{setPhase("running");setScore(0);setMisses(0);setTaps(0);setTimeLeft(30);let t=30;timerRef.current=setInterval(()=>{t--;setTimeLeft(t);if(t<=0){clearInterval(timerRef.current);clearTimeout(sigRef.current);setPhase("done");}},1000);const cycle=()=>{const g=Math.random()>.4;setSignal(g?"green":"red");sigRef.current=setTimeout(cycle,g?(700+Math.random()*1100):(550+Math.random()*750));};cycle();};
  useEffect(()=>()=>{clearInterval(timerRef.current);clearTimeout(sigRef.current);},[]);
  const tap=()=>{if(phase!=="running")return;setTaps(t=>t+1);if(signal==="green"){setScore(s=>s+1);setFeedback("✅ Go!");}else{setMisses(m=>m+1);setFeedback("⛔ Wait!");}setTimeout(()=>setFeedback(""),450);};
  const acc=taps>0?Math.round((score/taps)*100):0;
  return(<div style={{textAlign:"center",padding:"1rem"}}>
    <div className="fred" style={{fontSize:22,color:C.teal,marginBottom:4}}>🚦 Stop & Go</div>
    <div style={{fontSize:13,color:C.textSub,fontWeight:600,marginBottom:16}}>Tap ONLY on GREEN — practise self-control!</div>
    {phase==="ready"&&<button onClick={start} style={{background:C.teal,color:"white",borderRadius:11,padding:"12px 28px",fontSize:15,fontWeight:700}}>Start!</button>}
    {phase==="running"&&<><div style={{fontSize:14,fontWeight:700,marginBottom:14}}>⏱ {timeLeft}s · ✅ {score} · ⛔ {misses}</div>
    <div onClick={tap} style={{width:148,height:148,borderRadius:"50%",margin:"0 auto 14px",cursor:"pointer",background:signal==="green"?C.green:C.coral,boxShadow:`0 0 30px ${signal==="green"?C.green:C.coral}88`,transition:"all .18s",display:"flex",alignItems:"center",justifyContent:"center"}}><div className="fred" style={{fontSize:28,color:"white"}}>{signal==="green"?"GO!":"STOP"}</div></div>
    {feedback&&<div className="pop" style={{fontSize:18,fontWeight:800}}>{feedback}</div>}</>}
    {phase==="done"&&<><div className="fred" style={{fontSize:24,marginBottom:7}}>Time's up! 🎉</div><div style={{fontSize:15,fontWeight:700,color:C.teal,marginBottom:4}}>Accuracy: {acc}%</div><div style={{fontSize:13,color:C.textSub,marginBottom:16}}>{acc>=80?"Incredible impulse control! 🌟":acc>=60?"Great focus! 💙":"Keep practising — every game helps! 🐠"}</div><button onClick={start} style={{background:C.teal,color:"white",borderRadius:9,padding:"9px 22px",fontSize:14,fontWeight:700,marginRight:8}}>Play again!</button><button onClick={()=>onDone(score)} style={{background:C.green,color:"white",borderRadius:9,padding:"9px 22px",fontSize:14,fontWeight:700}}>Done ✓</button></>}
  </div>);
}

function SpotChange({onDone}){
  const EMOJIS=["🍎","🐶","🌟","🚗","🏠","🦋","🎈","🍕","⚽","🐱","🦊","🌈","🎸","🍦","🌸","🍓","🦄","🎯","🐬","🍀","🐧","🎃","🦁","🌻","🎵"];
  const [phase,setPhase]=useState("ready");const [grid,setGrid]=useState([]);const [changed,setChanged]=useState(null);const [score,setScore]=useState(0);const [round,setRound]=useState(0);const [feedback,setFeedback]=useState("");const [showing,setShowing]=useState(true);
  const newRound=useCallback(()=>{const items=[...EMOJIS].sort(()=>Math.random()-.5).slice(0,9);setGrid(items);setChanged(null);setShowing(true);setTimeout(()=>{const idx=Math.floor(Math.random()*9);const repl=EMOJIS.filter(e=>!items.includes(e))[0];const ng=[...items];ng[idx]=repl;setGrid(ng);setChanged(idx);setShowing(false);},2200);},[]);
  const tapG=i=>{if(showing||phase!=="playing")return;if(i===changed){setScore(s=>s+1);setFeedback("🎉 Found it!");setRound(r=>r+1);setTimeout(()=>{setFeedback("");newRound();},700);}else{setFeedback("🤔 Look again...");setTimeout(()=>setFeedback(""),700);}};

    </>}
  </div>);

/* ══════════ APP ROOT ══════════ */
function App(){
  const [page,setPage]=useState("loading");
  const [authMode,setAuthMode]=useState("signup");
  const [user,setUser]=useState(null);

  useEffect(()=>{
    // restore saved Gemini key
    const savedKey = LS.get("nb_gemini_key");
    if(savedKey) window.GEMINI_API_KEY = savedKey;

    const cur=LS.get("nb_cur");
    if(cur){
      const users=LS.get("nb_users")||{};
      if(users[cur]){
        setUser(users[cur]);
        setPage(savedKey ? "home" : "apikey");
        return;
      }
    }
    setPage(savedKey ? "landing" : "apikey");
  },[]);

  const onApiDone=()=>{
    const cur=LS.get("nb_cur");
    if(cur){const users=LS.get("nb_users")||{};if(users[cur]){setUser(users[cur]);setPage("home");return;}}
    setPage("landing");
  };
  const onAuth=m=>{setAuthMode(m);setPage("auth");};
  const onSuccess=u=>{setUser(u);setPage("home");};
  const onLogout=()=>{LS.del("nb_cur");setUser(null);setPage("landing");};
  const navHome=()=>{
    const cur=LS.get("nb_cur");
    if(cur){const users=LS.get("nb_users")||{};if(users[cur])setUser(users[cur]);}
    setPage("home");
  };

  if(page==="loading") return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg}}><Spin c={C.orange} s={40}/></div>;

  return(
    <React.Fragment>
      {page==="apikey"    && <ApiKeySetup onDone={onApiDone}/>}
      {page==="landing"   && <Landing onAuth={onAuth}/>}
      {page==="auth"      && <Auth mode={authMode} onSuccess={onSuccess} onSwitch={()=>setAuthMode(m=>m==="signup"?"login":"signup")}/>}
      {page==="home"      && user && <Home user={user} nav={setPage} onLogout={onLogout}/>}
      {page==="math"      && user && <MathSection    user={user} onBack={navHome}/>}
      {page==="reading"   && user && <ReadingSection  user={user} onBack={navHome}/>}
      {page==="focus"     && user && <FocusSection    user={user} onBack={navHome}/>}
      {page==="dashboard" && user && <Dashboard       user={user} onBack={navHome}/>}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
